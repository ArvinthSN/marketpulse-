name: MARKETPULSE CI

on:
  pull_request:
    branches: [main]
    paths:
      - "marketpulse/backend/**"
      - "marketpulse/frontend/**"
      - ".github/workflows/marketpulse-ci.yml"
  push:
    branches: ["feat/phase-4-global-dashboard"]
    paths:
      - "marketpulse/backend/**"
      - "marketpulse/frontend/**"
      - ".github/workflows/marketpulse-ci.yml"

permissions:
  contents: read

concurrency:
  group: marketpulse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketpulse/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: marketpulse/backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest tests/unit -v

  frontend-production-build:
    name: Frontend TypeScript and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketpulse/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: marketpulse/frontend/package.json
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
